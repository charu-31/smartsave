{% extends "base.html" %}

{% block content %}

<h1>🔔 Add Bill Reminder</h1>

<form method="POST">

    <div class="form-group">
        <label>Bill Name</label>
        <input type="text"
               name="bill_name"
               required>
    </div>

    <div class="form-group">
        <label>Due Date</label>
        <input type="date"
               name="due_date"
               required>
    </div>

    <button type="submit"
            class="btn-primary">
        Save Reminder
    </button>

</form>

{% endblock %}
