<!DOCTYPE html>


<hr>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Expenses</title>
    <link rel="stylesheet" 
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
{% extends "base.html" %}

{% block content %}

<h1>📋 View Expenses</h1>

<table border="1" cellpadding="10">

<tr>
    <th>Amount</th>
    <th>Category</th>
    <th>Description</th>
    <th>Date</th>
    <th>Actions</th>
</tr>

{% for expense in expenses %}
<tr>
    <td>₹ {{ expense[1] }}</td>
    <td>{{ expense[2] }}</td>
    <td>{{ expense[3] }}</td>
    <td>{{ expense[4] }}</td>

    <td>
        <a href="/edit_expense/{{ expense[0] }}"
           class="btn btn-warning">
           Edit
        </a>

        <a href="/delete_expense/{{ expense[0] }}"
           class="btn btn-danger">
           Delete
        </a>
    </td>
</tr>
{% endfor %}

</table>

{% endblock %}
</body>
</html>
